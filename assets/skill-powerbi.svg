<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112">
<style>
  .b { fill: none; stroke: #f2c811; stroke-width: 1.5; animation: pulso 3s ease-in-out infinite; animation-delay: 0.72s; }
  @keyframes pulso { 0%,100% { stroke-opacity: .25 } 50% { stroke-opacity: 1 } }
  .ic { animation: brilho 3s ease-in-out infinite; animation-delay: 0.72s; transform-origin: 56px 46px; }
  @keyframes brilho { 0%,100% { opacity: .75; transform: scale(1) } 50% { opacity: 1; transform: scale(1.06) } }
  .r { font: 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; fill: #c9d1d9; letter-spacing: .5px; }
  .l { stroke: #f2c811; stroke-width: 2; stroke-dasharray: 30 200; animation: volta 4s linear infinite; animation-delay: 0.72s; fill: none; }
  @keyframes volta { to { stroke-dashoffset: -400 } }
</style>
<defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="2" y="2" width="108" height="108" rx="14" fill="#0a0e14"/>
<rect class="b" x="2" y="2" width="108" height="108" rx="14"/>
<rect class="l" x="2" y="2" width="108" height="108" rx="14" filter="url(#g)"/>
<g class="ic" filter="url(#g)"><g fill="#f2c811"><rect x="38" y="40" width="9" height="28" rx="2" opacity=".55"/><rect x="51" y="30" width="9" height="38" rx="2" opacity=".8"/><rect x="64" y="20" width="9" height="48" rx="2"/></g></g>
<text class="r" x="56" y="94" text-anchor="middle">Power BI</text>
</svg>