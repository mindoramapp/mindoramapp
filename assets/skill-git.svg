  .l { stroke: #f05032; stroke-width: 2; stroke-dasharray: 30 200; animation: volta 4s linear infinite; animation-delay: 3.24s; fill: none; }
  @keyframes volta { to { stroke-dashoffset: -400 } }
</style>
