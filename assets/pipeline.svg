<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
<style>
  .num { font: 700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  .nome { font: 700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; letter-spacing: 1.5px; }
  .sub { font: 11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
  .cab { font: 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; fill: #8b949e; }
  .onda { animation: onda 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes onda { 0% { transform: scale(1); opacity: .9 } 40%,100% { transform: scale(1.7); opacity: 0 } }
  .trilho { stroke: #30363d; stroke-width: 2; }
  .fluxo { stroke: url(#gf); stroke-width: 2; stroke-dasharray: 10 14; animation: flui 1.2s linear infinite; }
  @keyframes flui { to { stroke-dashoffset: -24 } }
</style>
<defs>
  <linearGradient id="gf" x1="0" x2="1"><stop offset="0" stop-color="#ffd43b"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#b14cff"/></linearGradient>
  <filter id="gl" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="898" height="248" rx="14" fill="#0a0e14" stroke="#30363d"/>
